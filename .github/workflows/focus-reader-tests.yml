name: Focus Reader Lua checks
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/spotlight-white-mask
      - main
    tags:
      - 'v*'
  workflow_dispatch:
jobs:
  mocked-koreader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Plugin checks
        run: lua5.1 tests/test_plugin.lua
      - name: Geometry checks
        run: lua5.1 tests/test_logic.lua
      - name: Package release candidate
        run: python3 scripts/build_release.py
      - name: Verify packaged filename and artifact count
        run: |
          python3 - <<'PY'
          from pathlib import Path
          version = Path("VERSION").read_text().strip()
          files = list(Path("dist/release").glob("*.zip"))
          assert len(files) == 1, files
          expected = f"Focus-Reader-{version}-koplugin.zip"
          if __import__("os").environ.get("GITHUB_REF_TYPE") == "tag":
              expected = f"Focus-Reader-{__import__('os').environ['GITHUB_REF_NAME']}-koplugin.zip"
          assert files[0].name == expected, (files, expected)
          print("PASS:", expected)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: focus-reader-development
          path: dist/release/*.zip
          if-no-files-found: error
