name: Focus Reader Lua checks
on:
  push:
    branches:
      - feature/spotlight-white-mask
  workflow_dispatch:
jobs:
  mocked-koreader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Plugin checks
        run: lua5.1 tests/test_plugin.lua
      - name: Geometry checks
        run: lua5.1 tests/test_logic.lua
      - name: Package release candidate
        run: python3 scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: focus-reader-development
          path: dist/*.zip
          if-no-files-found: error
